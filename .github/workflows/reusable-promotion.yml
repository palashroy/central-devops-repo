name: Reusable Branch Promotion

on:
  workflow_call:
    inputs:
      target_branch:
        required: true
        type: string
        description: 'The branch to promote TO (qa or release)'
      source_branch:
        required: true
        type: string
        description: 'The branch to promote FROM (dev or qa)'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote Branch
        run: |
          echo "Promoting ${{ inputs.source_branch }} into ${{ inputs.target_branch }}..."
          
          # Fetch all branches to ensure runner tracking is current
          git fetch origin
          
          # Checkout the target branch and pull latest changes safely
          git checkout ${{ inputs.target_branch }}
          git pull origin ${{ inputs.target_branch }} --no-rebase
          
          # Standard Merge Commit (Handles diverged branches gracefully)
          git merge origin/${{ inputs.source_branch }} -m "Merge branch 'origin/${{ inputs.source_branch }}' into ${{ inputs.target_branch }}"
          
          # Push the changes back to the repository
          git push origin ${{ inputs.target_branch }}